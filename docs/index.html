<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics Learning — Nur Finance</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    :root { --theme-color: #0f766e; }
    .markdown-section { max-width: 860px; }
    .markdown-section details { background: #f6f8f7; border-left: 4px solid #0f766e; padding: .6em 1em; margin: 1em 0; border-radius: 4px; }
    .markdown-section details summary { cursor: pointer; font-weight: 600; }
    .markdown-section blockquote.story { border-left-color: #c2410c; background: #fff7ed; color: #3b1f0e; }
    .markdown-section blockquote.story p { color: inherit; }
    .markdown-section .badge { display: inline-block; font-size: .75em; padding: .1em .55em; border-radius: 999px; background: #0f766e; color: #fff; margin-right: .4em; vertical-align: middle; }
    .markdown-section .badge.hw { background: #c2410c; }
    .markdown-section .badge.stretch { background: #6d28d9; }
    .markdown-section .badge.company { background: #1d4ed8; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section .timebox { float: right; font-size: .8em; color: #666; }
    body { background: #fff; color: #34495e; }

    /* day quiz */
    .quiz { border: 1px solid #cfe3df; border-radius: 10px; padding: 1em 1.2em; margin: 1.5em 0; background: #fbfdfc; }
    .quiz-head { display: flex; flex-wrap: wrap; gap: .6em; align-items: baseline; margin-bottom: .8em; }
    .quiz-title { font-weight: 700; font-size: 1.1em; color: #0f766e; }
    .quiz-rule { color: #666; font-size: .9em; }
    .quiz-done { background: #0f766e; color: #fff; border-radius: 999px; padding: .05em .6em; font-size: .8em; }
    .quiz-q { padding: .7em .8em; margin: .6em 0; border-radius: 8px; border-left: 4px solid transparent; }
    .quiz-q.ok { background: #ecfdf5; border-left-color: #059669; }
    .quiz-q.bad { background: #fef2f2; border-left-color: #dc2626; }
    .quiz-qtext { margin-bottom: .4em; }
    .markdown-section pre.quiz-code { margin: .4em 0 .6em; padding: .6em .9em; font-size: .85em; }
    .quiz-opt { display: block; padding: .25em 0; cursor: pointer; }
    .quiz-opt input { margin-right: .4em; }
    .quiz-hint { font-size: .8em; color: #777; }
    .quiz-input { width: 100%; max-width: 360px; padding: .4em .6em; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
    .quiz-feedback { margin-top: .4em; font-size: .92em; }
    .quiz-actions button { font: inherit; padding: .5em 1.1em; border-radius: 8px; border: 0; background: #0f766e; color: #fff; cursor: pointer; margin-top: .6em; }
    .quiz-actions .quiz-retry { background: #475569; }
    .quiz-result { margin-top: .8em; padding: .7em .9em; border-radius: 8px; }
    .quiz-result.pass { background: #0f766e; color: #fff; }
    .quiz-result.fail { background: #fff7ed; color: #7c2d12; }
    .quiz-error { color: #b91c1c; }
    /* daily challenge */
    .chal { border: 1px solid #fcd34d; border-radius: 10px; padding: 1em 1.2em; margin: 1.5em 0; background: #fffbeb; }
    .chal-head { display: flex; flex-wrap: wrap; gap: .6em; align-items: baseline; margin-bottom: .6em; }
    .chal-title { font-weight: 700; font-size: 1.1em; color: #b45309; }
    .chal-rule { color: #92400e; font-size: .85em; }
    .chal-q { margin-bottom: .5em; }
    .chal-row { display: flex; gap: .5em; flex-wrap: wrap; margin-top: .4em; }
    .chal-row button { font: inherit; padding: .4em 1em; border-radius: 8px; border: 0; background: #b45309; color: #fff; cursor: pointer; }
    .chal-msg { margin-top: .5em; font-size: .92em; }
    .chal-msg.fail { color: #9a3412; }
    .chal-links { margin-top: .6em; font-size: .85em; }
    .chal-hinttext { margin-top: .4em; font-size: .9em; color: #78350f; }
    .chal-result { margin: .6em 0; padding: .6em .9em; border-radius: 8px; }
    .chal-result.pass { background: #b45309; color: #fff; }
    .chal-result.fail { background: #fef3c7; color: #78350f; }
    .markdown-section .chal-sol { background: #fff; border-left-color: #b45309; }
    .sidebar-nav a.day-done::after { content: " \2713"; color: #0f766e; font-weight: 700; }

    /* progress board */
    .al-icon { flex: none; }
    .lvl { border-radius: 12px; padding: 1.1em 1.3em; background: linear-gradient(135deg, #0f766e, #115e59); color: #fff; margin: 1em 0; }
    .lvl-top { display: flex; gap: 1em; align-items: center; }
    .lvl-name { font-size: 1.5em; font-weight: 700; }
    .lvl-note { opacity: .85; }
    .lvl-xp { margin-left: auto; text-align: right; }
    .lvl-xp b { font-size: 1.4em; }
    .lvl-xp span { opacity: .8; font-size: .85em; }
    .bar { height: 10px; background: rgba(255,255,255,.25); border-radius: 999px; margin: .9em 0 .4em; overflow: hidden; }
    .bar div { height: 100%; background: #fbbf24; border-radius: 999px; }
    .lvl-next { font-size: .9em; opacity: .9; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .7em; margin: 1em 0; }
    .stat { border: 1px solid #e2e8f0; border-radius: 10px; padding: .8em; color: #0f766e; }
    .stat b { display: block; font-size: 1.4em; color: #1f2937; margin-top: .3em; }
    .stat span { font-size: .8em; color: #64748b; }
    .board-note { color: #64748b; font-size: .9em; }
    .mss { display: grid; gap: .6em; }
    .ms { display: flex; gap: .9em; border: 1px solid #e2e8f0; border-radius: 10px; padding: .8em 1em; color: #94a3b8; }
    .ms.on { border-color: #059669; background: #ecfdf5; color: #065f46; }
    .ms-size { text-transform: uppercase; font-size: .7em; letter-spacing: .06em; }
    .ms.big .ms-size { color: #b45309; font-weight: 700; }
    .ms.grand { border: 1px solid #f59e0b; background: #fffbeb; color: #92400e; }
    .ms.grand .ms-size { color: #b45309; font-weight: 800; }
    .ms.grand.on { border-color: #d97706; background: #fef3c7; }
    .ms-reward { font-weight: 700; color: #1f2937; }
    .ms-what { font-size: .9em; color: #475569; }
    .ms-progress, .ms-state { font-size: .82em; margin-top: .2em; }
    .ms.on .ms-state { font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: .3em; margin-top: .4em; }
    .chip { font-size: .75em; padding: .1em .55em; border-radius: 999px; background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }
    .chip.reached { background: #059669; color: #fff; border-color: #059669; }
    .chip.given { background: #0f766e; color: #fff; border-color: #0f766e; text-decoration: line-through; }
    .bdgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6em; }
    .bdg { border: 1px dashed #cbd5e1; border-radius: 10px; padding: .8em; color: #cbd5e1; }
    .bdg.on { border: 1px solid #0f766e; color: #0f766e; background: #f0fdfa; }
    .bdg-name { font-weight: 700; margin-top: .3em; color: #94a3b8; }
    .bdg.on .bdg-name { color: #134e4a; }
    .bdg-how { font-size: .78em; color: #94a3b8; }
    .bdg.on .bdg-how { color: #475569; }
    .markdown-section table.pts { margin: .6em 0 1.2em; }
    .wallet { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6em; margin: .8em 0; }
    .wallet div { border: 1px solid #e2e8f0; border-radius: 10px; padding: .7em .9em; }
    .wallet span { display: block; font-size: .78em; color: #64748b; }
    .wallet b { font-size: 1.25em; color: #1f2937; }
    .wallet .bal { background: #0f766e; border-color: #0f766e; }
    .wallet .bal span, .wallet .bal b { color: #fff; }
    .chain { display: grid; gap: .4em; }
    .link { display: flex; align-items: center; gap: .8em; border: 1px solid #e2e8f0; border-radius: 10px; padding: .55em .9em; color: #94a3b8; }
    .link.won { border-color: #059669; background: #ecfdf5; color: #059669; }
    .link.next { border: 1px dashed #0f766e; color: #0f766e; }
    .link.missed { background: #fef2f2; color: #b91c1c; }
    .link-body { flex: 1; }
    .link-label { font-weight: 700; color: #1f2937; }
    .link-tag { font-size: .8em; }
    .link-val { font-weight: 700; font-size: 1.05em; color: #1f2937; white-space: nowrap; }
    .link.later .link-val { color: #94a3b8; font-weight: 400; }
    .markdown-section ul.menu { padding-left: 1.1em; }
    .markdown-section ul.menu span { color: #64748b; font-size: .9em; }
    .markdown-section table.pts tr.sum td { font-weight: 700; }
    /* course map */
    .map { margin: 1.2em 0; }
    .mweek { display: flex; gap: .9em; align-items: flex-start; }
    .mnode { flex: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #94a3b8; border: 2px solid #e2e8f0; font-size: 1.2em; }
    .mweek.here .mnode { background: #0f766e; color: #fff; border-color: #0f766e; box-shadow: 0 0 0 5px #ccfbf1; }
    .mweek.cleared .mnode { background: #059669; color: #fff; border-color: #059669; }
    .mpath { width: 4px; height: 22px; margin-left: 21px; background: repeating-linear-gradient(#cbd5e1 0 5px, transparent 5px 10px); }
    .mpath.cleared { background: #059669; }
    .mcard { flex: 1; min-width: 0; border: 1px solid #e2e8f0; border-radius: 12px; padding: .7em 1em; }
    .mweek.here .mcard { border-color: #0f766e; background: #f0fdfa; }
    .mweek.cleared .mcard { border-color: #a7f3d0; }
    .mweek.ahead .mcard { opacity: .6; }
    .mhead { display: flex; flex-wrap: wrap; gap: .5em; align-items: baseline; }
    .mlevel { font-size: .72em; text-transform: uppercase; letter-spacing: .06em; color: #0f766e; font-weight: 700; }
    .mtitle { font-weight: 700; color: #1f2937; }
    .mcount { margin-left: auto; font-size: .85em; color: #64748b; }
    .mdays { display: grid; gap: .25em; margin-top: .5em; }
    .markdown-section a.mday { display: flex; align-items: center; gap: .55em; padding: .25em .4em; border-radius: 8px; color: #334155; font-weight: 400; border: 0; text-decoration: none; }
    .markdown-section a.mday:hover { background: #f1f5f9; }
    .mdot { flex: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .85em; font-weight: 700; background: #f1f5f9; color: #64748b; }
    .mday.done .mdot { background: #059669; color: #fff; }
    .mday.here .mdot { background: #0f766e; color: #fff; }
    .mday.boss .mdot { background: #fef3c7; color: #b45309; }
    .mday.boss.done .mdot { background: #b45309; color: #fff; }
    .mday-name { min-width: 0; }
    .mday.boss .mday-name { font-weight: 700; }
    .mtag { display: inline-flex; }
    .mtag.star { color: #b45309; }
    .mtag.gift { color: #be185d; }
    .mhere { font-size: .72em; background: #0f766e; color: #fff; border-radius: 999px; padding: .05em .55em; white-space: nowrap; }
    .mreward { display: inline-flex; align-items: center; gap: .3em; margin-top: .5em; font-size: .85em; color: #b45309; }
    .mreward.won { color: #059669; font-weight: 700; }
    .mreward.missed { color: #b91c1c; }
    .chal-lucky { display: flex; gap: .6em; align-items: center; margin: -.2em 0 .7em; padding: .55em .8em; border-radius: 8px; background: #fdf2f8; color: #9d174d; border: 1px solid #fbcfe8; }
    .fb-card { display: flex; gap: .9em; align-items: flex-start; margin: 2em 0 1em; padding: 1em 1.2em; border-radius: 12px; border: 1px solid #c7d2fe; background: #eef2ff; color: #3730a3; }
    .fb-title { font-weight: 700; font-size: 1.1em; color: #312e81; }
    .fb-text { color: #475569; margin: .2em 0 .7em; }
    .markdown-section a.fb-go { display: inline-block; padding: .45em 1.1em; border-radius: 8px; background: #4338ca; color: #fff; font-weight: 600; text-decoration: none; border: 0; }
    /* SQL in the browser (sqlrun.js) */
    .sq-box, .sq-ws { border: 1px solid #cbd5e1; border-radius: 10px; margin: 1em 0; background: #f8fafc; overflow: hidden; }
    .sq-edit { display: block; width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid #e2e8f0; padding: .7em .9em; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #0f172a; color: #e2e8f0; resize: vertical; }
    .sq-bar { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; padding: .5em .8em; }
    .sq-bar button, .sq-ws-foot button { font: inherit; font-size: .9em; padding: .35em .9em; border-radius: 7px; border: 0; cursor: pointer; background: #0f766e; color: #fff; }
    .sq-bar .sq-reset { background: #64748b; }
    .sq-bar .sq-check { background: #1d4ed8; }
    .sq-hint, .sq-msg { font-size: .85em; color: #64748b; }
    .sq-out { padding: 0 .8em .6em; }
    .sq-note { font-size: .85em; color: #475569; margin: .3em 0; }
    .sq-err { font-size: .9em; color: #b91c1c; background: #fef2f2; border-radius: 6px; padding: .4em .7em; margin: .3em 0; }
    .sq-scroll { overflow-x: auto; max-height: 320px; overflow-y: auto; }
    .markdown-section table.sq-table { display: table; width: auto; font-size: .82em; margin: .2em 0; }
    .markdown-section table.sq-table td, .markdown-section table.sq-table th { padding: .25em .6em; }
    .sq-ws { background: #fff; border: 2px solid #0f766e; }
    .sq-ws-head { padding: .8em 1em; background: #f0fdfa; border-bottom: 1px solid #ccfbf1; }
    .sq-ws-title { display: block; font-weight: 700; color: #0f766e; font-size: 1.1em; }
    .sq-ws-sub { font-size: .85em; color: #475569; }
    .sq-task { border-bottom: 1px solid #e2e8f0; }
    .sq-task-q { padding: .6em .9em; }
    .sq-task.ok .sq-task-q { background: #ecfdf5; }
    .sq-task.bad .sq-task-q { background: #fef2f2; }
    .sq-chip { display: inline-block; width: 1.6em; }
    .sq-ws-foot { padding: .8em 1em; display: flex; flex-wrap: wrap; gap: .6em; align-items: center; }
    .sq-ws-foot .sq-submit { background: #c2410c; }
    .sq-ws-foot button:disabled { background: #cbd5e1; cursor: not-allowed; }
    .sq-ws-state { flex-basis: 100%; font-size: .9em; color: #334155; }
    /* mini-games (games.js) */
    .gm { border: 1px solid #c4b5fd; background: #faf5ff; border-radius: 12px; padding: .9em 1.1em; margin: 1.3em 0; }
    .gm.gm-won { border-color: #059669; background: #f0fdf4; }
    .gm-head { display: flex; gap: .6em; align-items: center; margin-bottom: .5em; }
    .gm-badge { font-size: .75em; background: #6d28d9; color: #fff; border-radius: 999px; padding: .1em .6em; }
    .gm-title { font-weight: 700; color: #4c1d95; }
    .gm-q { margin-bottom: .5em; }
    .gm-cols, .gm-bins { display: grid; grid-template-columns: 1fr 1fr; gap: .6em; }
    .gm-col, .gm-pool { display: flex; flex-wrap: wrap; gap: .4em; align-content: flex-start; }
    .gm-col { flex-direction: column; }
    .gm-it, .gm-colbtn { font: inherit; font-size: .9em; text-align: left; padding: .4em .7em; border-radius: 8px; border: 1px solid #c4b5fd; background: #fff; color: #1f2937; cursor: pointer; }
    .gm-it.gm-sel { border-color: #6d28d9; box-shadow: 0 0 0 2px #ddd6fe; }
    .gm-it.gm-ok, .gm-colbtn.gm-ok { background: #059669; border-color: #059669; color: #fff; }
    .gm-no { animation: gm-shake .4s; border-color: #dc2626 !important; }
    @keyframes gm-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .gm-seq { margin: .3em 0 .6em 1.2em; }
    .gm-seq li { color: #065f46; font-weight: 600; }
    .gm-bin { border: 1px dashed #a78bfa; border-radius: 10px; padding: .5em; min-height: 3.2em; cursor: pointer; background: #fff; }
    .gm-bin-name { font-weight: 700; font-size: .85em; color: #5b21b6; margin-bottom: .3em; }
    .gm-tag { display: inline-block; font-size: .8em; background: #059669; color: #fff; border-radius: 6px; padding: .1em .45em; margin: .1em; }
    .gm-pool { margin-bottom: .6em; }
    .gm-scroll { overflow-x: auto; }
    .markdown-section table.gm-table { display: table; width: auto; font-size: .85em; }
    .gm-join { position: relative; display: flex; justify-content: space-between; gap: 2.5em; }
    .gm-tb { display: flex; flex-direction: column; gap: .3em; z-index: 1; }
    .gm-tb-name { font-weight: 700; color: #4c1d95; }
    .gm-lines { position: absolute; left: 0; top: 0; pointer-events: none; }
    .gm-lines line { stroke: #059669; stroke-width: 3; }
    .gm-foot { display: flex; justify-content: space-between; align-items: center; gap: .6em; margin-top: .6em; font-size: .9em; }
    .gm-again { font: inherit; font-size: .85em; border: 0; background: transparent; color: #6d28d9; cursor: pointer; }
    @media (max-width: 600px) { .gm-cols, .gm-bins { grid-template-columns: 1fr; } }
    /* ===== design pass ===== */
    :root { --brand: #0f766e; --brand-2: #115e59; --ink: #0f172a; --body: #334155; --muted: #64748b; --line: #e2e8f0; --soft: #f8fafc; --radius: 12px; }
    body, .markdown-section, .sidebar { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { color: var(--body); background: #fff; -webkit-font-smoothing: antialiased; }
    .markdown-section { max-width: 900px; padding: 32px 40px 64px; line-height: 1.7; font-size: 16px; }
    .markdown-section h1 { font-size: 2em; font-weight: 700; color: var(--ink); letter-spacing: -.02em; margin-bottom: .4em; }
    .markdown-section h2 { font-size: 1.45em; font-weight: 700; color: var(--ink); margin: 2.2em 0 .7em; padding-bottom: .35em; border-bottom: 1px solid var(--line); }
    .markdown-section h3 { font-size: 1.15em; font-weight: 600; color: var(--ink); margin-top: 1.8em; }
    .markdown-section p, .markdown-section li { color: var(--body); }
    .markdown-section strong { color: var(--ink); }
    .markdown-section a { color: var(--brand); font-weight: 500; }
    .markdown-section hr { border: 0; border-top: 1px solid var(--line); margin: 2.2em 0; }
    .markdown-section code { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: .86em; background: #f1f5f9; color: #0f172a; border-radius: 5px; padding: .12em .38em; }
    .markdown-section pre { border-radius: var(--radius); border: 1px solid var(--line); background: var(--soft); }
    .markdown-section pre > code { background: transparent; padding: 0; }
    .markdown-section table { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); border-collapse: separate; border-spacing: 0; }
    .markdown-section table thead th { background: #f1f5f9; color: var(--ink); font-weight: 600; }
    .markdown-section table td, .markdown-section table th { border: 0; border-bottom: 1px solid var(--line); }
    .markdown-section tr:nth-child(2n) { background: #fbfdff; }
    .markdown-section blockquote.story { border-left: 4px solid #f97316; background: #fff7ed; border-radius: 0 var(--radius) var(--radius) 0; padding: .9em 1.2em; }
    .markdown-section details { border-radius: 10px; border: 1px solid #ccfbf1; border-left: 4px solid var(--brand); background: #f6fefc; }
    .markdown-section details[open] summary { margin-bottom: .5em; }
    .markdown-section .badge { font-weight: 600; letter-spacing: .01em; padding: .18em .65em; }
    /* sidebar */
    .sidebar { background: #fbfcfd; border-right: 1px solid var(--line); }
    .sidebar > h1 { margin: 1.1em 0 .6em; }
    .sidebar > h1 a { font-size: 1.15em; font-weight: 700; color: var(--brand) !important; letter-spacing: -.01em; }
    .sidebar-nav li { margin: 1px 0; }
    .sidebar-nav > ul > li > strong, .sidebar-nav > ul > li > p { font-size: .78em; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-top: 1.2em; }
    .sidebar-nav a { border-radius: 8px; padding: .28em .6em !important; color: #334155 !important; font-size: .93em; }
    .sidebar-nav a:hover { background: #eef6f5; }
    .sidebar-nav li.active > a { background: #ccfbf1; color: var(--brand-2) !important; font-weight: 600; border-right: 0 !important; }
    .search input { border-radius: 10px; border: 1px solid var(--line); }
    /* buttons everywhere */
    .quiz-actions button, .sq-bar button, .sq-ws-foot button, .chal-row button, .gm-it, .fb-go, .yt-go { transition: transform .08s ease, box-shadow .15s ease, background .15s ease; }

    /* the quiz, one question at a time */
    .quiz { border-radius: 16px; border: 1px solid #cfe3df; background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.06); padding: 1.2em 1.4em; }

    .quiz-q { border: 0; padding: .4em 0; }
    .quiz-review .quiz-q { border-left: 4px solid transparent; padding: .7em .9em; border-radius: 10px; margin: .6em 0; }
    .quiz-qtext { font-size: 1.05em; color: var(--ink); margin-bottom: .7em; }
    .quiz-opt { display: block; border: 1px solid var(--line); border-radius: 10px; padding: .6em .9em; margin: .45em 0; background: #fff; transition: border-color .15s, background .15s; }

    .quiz-opt:has(input:checked) { border-color: var(--brand); background: #f0fdfa; box-shadow: 0 0 0 1px var(--brand) inset; }
    .quiz-input { border-radius: 10px; padding: .6em .8em; border: 1px solid #cbd5e1; }
    .quiz-actions { display: flex; gap: .6em; flex-wrap: wrap; margin-top: .8em; }
    .quiz-actions button { margin-top: 0; padding: .6em 1.3em; font-weight: 600; border-radius: 10px; }
    .quiz-actions .quiz-back { background: #fff; color: var(--body); border: 1px solid var(--line); }
    .quiz-actions .quiz-check { background: #c2410c; }
    .quiz-actions button:disabled { background: #cbd5e1; color: #fff; cursor: not-allowed; }
    .quiz-result { border-radius: 12px; font-size: 1.02em; margin: .5em 0 .8em; }
    /* the database panel */
    #sq-db-btn { position: fixed; right: 18px; bottom: 18px; z-index: 30; font: 600 14px Inter, sans-serif; padding: .7em 1.1em; border: 0; border-radius: 999px; background: var(--ink); color: #fff; box-shadow: 0 6px 20px rgba(15,23,42,.25); cursor: pointer; }
    #sq-db { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 92vw; z-index: 40; background: #fff; border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(15,23,42,.12);
      display: flex; flex-direction: column; transform: translateX(105%); transition: transform .22s ease; font-family: Inter, sans-serif; }
    #sq-db.open { transform: none; }
    .db-head { display: flex; justify-content: space-between; align-items: center; padding: .9em 1em; border-bottom: 1px solid var(--line); color: var(--ink); }
    .db-x, .db-prev-x { border: 0; background: transparent; font-size: 1.1em; cursor: pointer; color: var(--muted); }
    .db-tip { font-size: .8em; color: var(--muted); padding: .5em 1em 0; }

    .db-list { overflow-y: auto; flex: 1; padding: 0 .6em 1em; font-size: .9em; }
    .db-t { border-radius: 8px; }
    .db-t summary { cursor: pointer; display: flex; justify-content: space-between; padding: .4em .5em; border-radius: 8px; list-style: none; }
    .db-t summary::before { content: "▸"; margin-right: .4em; color: var(--muted); }
    .db-t[open] summary::before { content: "▾"; }
    .db-t summary:hover { background: #f1f5f9; }
    .db-tn { font-weight: 600; color: var(--ink); flex: 1; }
    .db-rows { color: var(--muted); font-size: .85em; }
    .db-about { font-size: .8em; color: var(--muted); padding: 0 .6em .3em 1.6em; }
    .db-acts { display: flex; gap: .4em; padding: 0 .6em .3em 1.6em; }
    .db-acts button { font: inherit; font-size: .78em; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: .15em .5em; cursor: pointer; }
    .db-c { display: flex; width: calc(100% - 1.2em); margin-left: 1.2em; align-items: center; gap: .4em; border: 0; background: transparent; font: inherit; font-size: .88em; text-align: left; padding: .25em .4em; border-radius: 6px; cursor: pointer; color: var(--body); }
    .db-c:hover { background: #ecfeff; }
    .db-c > span:first-child { font-family: "JetBrains Mono", monospace; flex: 1; }
    .db-c.db-hit { background: #fef9c3; }
    .db-k { font-size: .7em; font-weight: 700; border-radius: 4px; padding: .05em .35em; }
    .db-k.pk { background: #fde68a; color: #78350f; }
    .db-k.fk { background: #dbeafe; color: #1e3a8a; }
    .db-ty { font-size: .75em; color: var(--muted); }
    .db-prev { border-top: 1px solid var(--line); max-height: 40%; overflow: auto; padding: .4em .8em; }

    .sq-bar .sq-tables, .sq-ws-head .sq-tables { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .sq-ws-head .sq-tables { margin-top: .5em; font: inherit; font-size: .85em; padding: .3em .8em; border-radius: 7px; cursor: pointer; }
    .sq-box, .sq-ws { border-radius: 14px; }
    .sq-edit { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; }
    .sq-file { display: inline-block; font-size: .9em; padding: .35em .9em; border-radius: 7px; background: #0f766e; color: #fff; cursor: pointer; }
    .sq-file input { display: none; }
    .sq-fname { font-size: .85em; color: var(--ink); }
    .sq-opt { font-size: .75em; background: #e2e8f0; color: var(--muted); border-radius: 999px; padding: .05em .5em; }
    /* video cards */
    .yt { display: flex; gap: .9em; align-items: center; margin: .5em 0; padding: .55em; border: 1px solid var(--line); border-radius: 12px; background: #fff; max-width: 640px; vertical-align: middle; }
    .yt.yt-on { flex-direction: column; align-items: stretch; }
    .yt-thumb { position: relative; flex: none; width: 168px; aspect-ratio: 16 / 9; border: 0; padding: 0; border-radius: 8px; overflow: hidden; cursor: pointer; background: #0f172a; }
    .yt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .92; }
    .yt-play { position: absolute; inset: 0; margin: auto; width: 42px; height: 30px; border-radius: 8px; background: #dc2626; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .yt-at { position: absolute; right: 5px; bottom: 5px; background: rgba(15,23,42,.85); color: #fff; font-size: 11px; border-radius: 4px; padding: 1px 5px; }
    .yt-body { display: flex; flex-direction: column; gap: .35em; min-width: 0; }
    .yt-title { font-weight: 600; color: var(--ink); font-size: .93em; line-height: 1.35; }
    .yt-acts { display: flex; gap: .8em; align-items: center; flex-wrap: wrap; font-size: .85em; }
    .yt-go { border: 0; background: #dc2626; color: #fff; border-radius: 7px; padding: .3em .8em; font: inherit; font-weight: 600; cursor: pointer; }
    .yt-frame { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; }
    @media (max-width: 700px) {
      .markdown-section { padding: 20px 16px 48px; }
      .yt { flex-direction: column; align-items: stretch; }
      .yt-thumb { width: 100%; }
      #sq-db-btn { right: 12px; bottom: 12px; }
    }
  </style>
